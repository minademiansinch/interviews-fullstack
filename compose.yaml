services:
  postgres:
    image: postgres:16-alpine
    container_name: fullstack-prepaid-postgres
    environment:
      POSTGRES_DB: prepaid_db
      POSTGRES_USER: prepaid
      POSTGRES_PASSWORD: prepaid
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepaid -d prepaid_db"]
      interval: 2s
      timeout: 3s
      retries: 20
